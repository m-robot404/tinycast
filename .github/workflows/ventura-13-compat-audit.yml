name: Ventura 13 compatibility audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "Tinycast/**"
      - "Tinycast.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ventura-13-compat-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventura-13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 16.4's SDK can target macOS 13 and catches accidental dependencies
    # on newer SDK-only symbols. The build runner itself is not Ventura.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_16.4.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode 16.4 is not installed on this runner image."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build app and embedded helpers for macOS 13
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Tinycast.xcodeproj \
            -scheme Tinycast \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/VenturaDerivedData" \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ventura-build.log"

      - name: Upload unsigned Apple Silicon app build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tinycast-ventura13-unsigned-arm64
          path: "${{ runner.temp }}/VenturaDerivedData/Build/Products/Debug/Tinycast Dev.app"
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventura-13-build-diagnostics
          path: |
            ${{ runner.temp }}/ventura-build.log
            ${{ runner.temp }}/VenturaDerivedData/Logs/Build
          if-no-files-found: ignore
