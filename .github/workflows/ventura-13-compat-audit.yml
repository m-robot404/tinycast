name: Ventura 13 compatibility audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "Tinycast/**"
      - "Tinycast.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ventura-13-compat-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventura-13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 Apple Silicon runner. The SDK compiles against a macOS 13 deployment target;
    # a separate real Ventura runtime check remains required.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify installed Xcode and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Build app and embedded helpers for macOS 13
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Tinycast.xcodeproj \
            -scheme Tinycast \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/VenturaDerivedData" \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ventura-build.log"

      - name: Upload unsigned Apple Silicon app build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tinycast-ventura13-unsigned-arm64
          path: "${{ runner.temp }}/VenturaDerivedData/Build/Products/Debug/Tinycast Dev.app"
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventura-13-build-diagnostics
          path: |
            ${{ runner.temp }}/ventura-build.log
            ${{ runner.temp }}/VenturaDerivedData/Logs/Build
          if-no-files-found: ignore
